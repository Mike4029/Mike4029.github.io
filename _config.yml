# ============ 基本信息 ============
title: 特依
description: 记录学习、思考
author: Mike

# ============ URL 设置 ============
# 用户/组织站点（仓库名是 用户名.github.io）填下面这个
url: "https://Mike4029.github.io"
baseurl: ""

# 如果是项目站点（仓库名不是 用户名.github.io），baseurl 填 /仓库名
# url: "https://Mike4029.github.io"
# baseurl: "/仓库名"

# ============ 构建设置 ============
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# ============ 主题 ============
theme: jekyll-theme-minimal

# ============ 插件（GitHub Pages 白名单内） ============
plugins:
  - jekyll-feed        # 生成 RSS 订阅
  - jekyll-sitemap     # 生成 sitemap.xml（利于搜索收录）
  - jekyll-seo-tag     # SEO 元标签

# ============ 分页（可选） ============
# paginate: 10
# paginate_path: "/page:num/"

